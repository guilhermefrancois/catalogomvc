<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Musical - Artistas</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>

<body>

<header>
    <h1>Catálogo Musical</h1>
    <p>Conheça seus artistas favoritos</p>
</header>

<main>
    <h2>Lista de Artistas</h2>

    <div class="lista">
        <div class="card" th:each="cantor : ${cantores}">
            <h3 th:text="${cantor.nome}">Nome do cantor</h3>
            <p>
                Origem: <span th:text="${cantor.nacionalidade}"></span>
            </p>
            <a class="nav-link"
               th:href="@{/cantores/{id}/albuns(id=${cantor.id})}"
               th:data-title="${cantor.nome}"
               data-sub="Carregando discografia...">
                Ver Álbuns →
            </a>
        </div>
    </div>
</main>

<!-- Overlay da Tela de Transição -->
<div id="page-transition-overlay">
    <div class="transition-content">
        <h1 class="transition-album-title" id="overlay-title">Artista</h1>
        <p class="transition-artist-name" id="overlay-sub">Carregando...</p>
    </div>
</div>

<!-- Script de Transição -->
<script>
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');
            document.getElementById('overlay-title').textContent = this.getAttribute('data-title');
            document.getElementById('overlay-sub').textContent = this.getAttribute('data-sub');

            const overlay = document.getElementById('page-transition-overlay');
            overlay.classList.add('active');

            // Aumentado para 1200 milissegundos (1.2 segundos)
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 1200);
        });
    });
</script>

</body>
</html>
